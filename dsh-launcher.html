<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH 啟動台</title>
<style>
  :root {
    --backdrop: #d6d6db;
    --window-bg: #eef0f3;
    --panel-bg: #ffffff;
    --panel-dim: #f7f7f9;
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #a1a1a6;
    --accent: #0a84ff;
    --accent-soft: #e8f2ff;
    --ok: #30a46c;
    --warn: #f5a623;
    --err: #e5484d;
    --divider: #e5e5ea;
    --log-bg: #ffffff;
    --log-text: #1d1d1f;
    --shadow-window: 0 30px 80px rgba(0,0,0,0.28), 0 4px 16px rgba(0,0,0,0.12);
    --shadow-panel: 0 1px 1px rgba(0,0,0,0.03), 0 6px 16px rgba(0,0,0,0.05);
    --r-window: 26px;
    --r-panel: 20px;
    --r-item: 14px;
    --r-pill: 999px;
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  html[data-theme="dark"] {
    --backdrop: #1a1a1c;
    --window-bg: #232326;
    --panel-bg: #2b2b2f;
    --panel-dim: #26262a;
    --text-primary: #f2f2f4;
    --text-secondary: #9a9aa0;
    --text-tertiary: #6e6e73;
    --accent: #0a84ff;
    --accent-soft: #12283f;
    --divider: #3a3a3e;
    --log-bg: #1c1c1f;
    --log-text: #d7d7db;
    --shadow-window: 0 30px 80px rgba(0,0,0,0.6);
    --shadow-panel: 0 1px 1px rgba(0,0,0,0.2), 0 6px 16px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  button, .seg, .seg > div, .titlebar, .row-label, .chip { user-select: none; -webkit-user-select: none; }
  .log-body, .log-body *, input, .url-text, .check-value, .notes, .notes * { user-select: text; -webkit-user-select: text; }
  html, body { height: 100%; margin: 0; font-family: var(--font-ui); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  body { background: radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5) 0%, transparent 45%), radial-gradient(circle at 85% 80%, rgba(0,0,0,0.08) 0%, transparent 50%), var(--backdrop); }
  .wrap { height: 100vh; padding: 2.2vh 2.2vw; display: flex; align-items: center; justify-content: center; }
  .app {
    width: 100%; height: 100%; max-width: 1180px; background: var(--window-bg);
    border-radius: var(--r-window); box-shadow: var(--shadow-window); overflow: hidden;
    display: grid; grid-template-rows: 52px 1fr;
  }
  .titlebar { display: flex; align-items: center; gap: 12px; padding: 0 18px; background: var(--panel-bg); border-bottom: 1px solid var(--divider); }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .title { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
  .spacer { flex: 1; }
  .status-pill { display: flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: var(--r-pill); background: var(--panel-dim); font-size: 12px; color: var(--text-secondary); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary); }
  .led.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .led.off { background: var(--err); }
  .led.busy { background: var(--warn); animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .icon-btn { border: none; background: var(--panel-dim); color: var(--text-secondary); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-size: 15px; }
  .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .body { padding: 18px; overflow-y: auto; display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; align-content: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { background: var(--panel-bg); border-radius: var(--r-panel); box-shadow: var(--shadow-panel); padding: 16px 18px; }
  .panel-title { font-size: 12px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .big-btn { border: none; border-radius: var(--r-item); padding: 16px 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; background: var(--accent); transition: transform .12s, filter .12s; }
  .big-btn:hover { filter: brightness(1.07); } .big-btn:active { transform: scale(.97); }
  .big-btn.stop { background: var(--err); }
  .big-btn.restart { background: var(--warn); }
  .big-btn:disabled { opacity: .45; cursor: not-allowed; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-dim); border-radius: var(--r-item); padding: 3px; gap: 3px; }
  .seg > div { text-align: center; padding: 9px; border-radius: 11px; font-size: 13px; cursor: pointer; color: var(--text-secondary); }
  .seg > div.active { background: var(--panel-bg); color: var(--text-primary); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .field { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .field label { font-size: 13px; color: var(--text-secondary); min-width: 52px; }
  input[type=number] { flex: 1; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--divider); background: var(--panel-dim); color: var(--text-primary); font-family: var(--font-mono); font-size: 13px; }
  input[type=number]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .row-label { color: var(--text-secondary); flex-shrink: 0; }
  .check-value { font-family: var(--font-mono); font-size: 12px; text-align: right; word-break: break-all; user-select: text; }
  .ok-v { color: var(--ok); } .err-v { color: var(--err); } .dim-v { color: var(--text-tertiary); }
  .url-box { display: flex; gap: 8px; align-items: stretch; }
  .url-text { flex: 1; font-family: var(--font-mono); font-size: 11px; padding: 9px 11px; border-radius: 11px; background: var(--panel-dim); color: var(--text-secondary); word-break: break-all; user-select: text; max-height: 78px; overflow-y: auto; }
  .mini-btn { border: none; border-radius: 11px; padding: 0 13px; background: var(--accent-soft); color: var(--accent); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .mini-btn:hover { background: var(--accent); color: #fff; }
  .mini-btn:disabled { opacity: .4; cursor: not-allowed; }
  .quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
  .quick button { border: 1px solid var(--divider); background: var(--panel-dim); color: var(--text-primary); border-radius: 11px; padding: 10px; font-family: inherit; font-size: 12.5px; cursor: pointer; }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }
  .log-panel { display: flex; flex-direction: column; min-height: 300px; }
  .log-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .log-body { flex: 1; background: var(--log-bg); border-radius: var(--r-item); border: 1px solid var(--divider); padding: 11px 13px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.65; color: var(--log-text); overflow-y: auto; white-space: pre-wrap; word-break: break-all; cursor: text; min-height: 240px; max-height: 46vh; }
  .log-line.err { color: var(--err); }
  .log-line.dim { color: var(--text-tertiary); }
  .notes { margin-top: 10px; font-size: 12px; color: var(--text-secondary); line-height: 1.6; white-space: pre-wrap; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text-primary); color: var(--window-bg); padding: 11px 20px; border-radius: var(--r-pill); font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 3px 9px; border-radius: var(--r-pill); background: var(--panel-dim); color: var(--text-secondary); font-family: var(--font-mono); }
  @media (max-width: 900px) { .body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="app">
    <div class="titlebar">
      <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
      <div class="title">DSH 啟動台</div>
      <div class="spacer"></div>
      <div class="status-pill"><span class="led" id="led"></span><span id="statusText">檢查中…</span></div>
      <button class="icon-btn" id="themeBtn" title="切換深淺色">◐</button>
    </div>

    <div class="body">
      <div class="col">
        <div class="panel">
          <div class="panel-title">控制</div>
          <div class="actions">
            <button class="big-btn" id="btnStart">啟動</button>
            <button class="big-btn stop" id="btnStop">停止</button>
            <button class="big-btn restart" id="btnRestart">重新啟動</button>
          </div>
          <div style="margin-top:14px">
            <div class="seg" id="modeSeg">
              <div data-mode="browser">瀏覽器模式</div>
              <div data-mode="app" class="active">應用程式模式</div>
            </div>
          </div>
          <div class="field">
            <label>連接埠</label>
            <input type="number" id="portInput" value="3080" min="1" max="65535">
          </div>
          <div class="notes" id="notes"></div>
        </div>

        <div class="panel">
          <div class="panel-title">服務狀態</div>
          <div class="row"><span class="row-label">狀態</span><span class="check-value" id="sRunning">—</span></div>
          <div class="row"><span class="row-label">PID</span><span class="check-value" id="sPid">—</span></div>
          <div class="row"><span class="row-label">啟動耗時</span><span class="check-value" id="sStart">—</span></div>
          <div class="row"><span class="row-label">漂浮球 helper</span><span class="check-value" id="sOrb">—</span></div>
          <div class="panel-title" style="margin-top:16px">已認證 URL</div>
          <div class="url-box">
            <div class="url-text" id="urlText">—</div>
            <button class="mini-btn" id="btnCopy">複製</button>
          </div>
          <div class="quick">
            <button data-open="url">開啟 DSH 視窗（不重啟）</button>
            <button id="btnReloadPage">重新載入此頁</button>
            <button data-open="home">開啟 .dsh 資料夾</button>
            <button id="btnInstall">安裝／檢查元件</button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="panel">
          <div class="panel-title">環境檢查</div>
          <div class="row"><span class="row-label">Node</span><span class="check-value" id="cNode">—</span></div>
          <div class="row"><span class="row-label">dsh CLI</span><span class="check-value" id="cCli">—</span></div>
          <div class="row"><span class="row-label">Profile</span><span class="check-value" id="cProfiles">—</span></div>
          <div class="row" style="display:block">
            <span class="row-label">已安裝插件</span>
            <div class="chips" id="cPlugins"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">外掛與補丁</div>
          <div class="row"><span class="row-label">Our Free Model</span><span class="check-value" id="pOfm">—</span></div>
          <div class="row"><span class="row-label">補丁狀態</span><span class="check-value" id="pPatch">—</span></div>
          <div class="row"><span class="row-label">廣告橫幅</span><span class="check-value" id="pAds">—</span></div>
          <div class="quick" style="grid-template-columns:1fr 1fr">
            <button id="btnOfmUpgrade">檢查安裝並修復</button>
            <button id="btnPatches">修復補丁並重啟</button>
            <button id="btnReloadPlugin">重載外掛（不重啟 DSH）</button>
            <button id="btnGuardInstall">移除舊版排程</button>
            <button id="btnGuardStatus">補丁自檢</button>
            <button id="btnUpdateCheck">檢查新版與專案搬移</button>
          </div>
          <div class="notes" id="patchNotes"></div>
          <div class="notes" id="updateNotes">更新保護不需要保持此視窗開啟。關閉後啟動台會自動休眠。</div>
        </div>

        <div class="panel log-panel">
          <div class="log-head">
            <div class="panel-title" style="margin:0">即時日誌</div>
            <button class="mini-btn" id="btnClear">清空</button>
          </div>
          <div class="log-body" id="logBody"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);

const logBody = $('logBody');
let logLines = [];
let authenticatedUrl = '';

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function appendLog(entry) {
  logLines.push(entry);
  if (logLines.length > 400) logLines = logLines.slice(-400);
  const div = document.createElement('div');
  div.className = 'log-line' + (/error|失敗|錯誤|警告|警告/i.test(entry.line) ? ' err' : '');
  const d = new Date(entry.t);
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0'), ss = String(d.getSeconds()).padStart(2,'0');
  div.textContent = '[' + hh + ':' + mm + ':' + ss + '] ' + entry.line;
  logBody.appendChild(div);
  while (logBody.childElementCount > 400) logBody.removeChild(logBody.firstChild);
  logBody.scrollTop = logBody.scrollHeight;
}

async function api(path, opts) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(path + sep + 't=' + encodeURIComponent(TOKEN), opts);
  return res.json();
}

let busy = false;
function setBusy(v, label) {
  busy = v;
  for (const id of ['btnStart','btnStop','btnRestart','btnOfmUpgrade','btnPatches','btnGuardInstall','btnGuardStatus','btnReloadPlugin']) $(id).disabled = v;
  $('led').className = 'led ' + (v ? 'busy' : '');
  if (v) $('statusText').textContent = label || '處理中…';
}

function render(state) {
  const running = state.running;
  if (!busy) {
    $('led').className = 'led ' + (running ? 'on' : 'off');
    $('statusText').textContent = state.setup?.running ? '正在安裝元件…' : (running ? ((state.ready ? '已就緒 · ' : '待修復登入 · ') + state.port) : '未執行');
  }
  $('sRunning').innerHTML = running
    ? '<span class="ok-v">執行中</span>'
    : (state.foreignPid
        ? '<span class="err-v">埠被 ' + (state.foreignName || '未知') + ' 佔用</span>'
        : '<span class="dim-v">未執行</span>');
  $('sPid').textContent = state.pid || (state.foreignPid ? ('外部 PID ' + state.foreignPid) : '—');
  $('sStart').textContent = state.startupMs ? (state.startupMs / 1000).toFixed(1) + ' 秒' : '—';
  $('sOrb').textContent = state.orbHelpers ? (state.orbHelpers + ' 個') : '0 個';

  authenticatedUrl = state.url || '';
  if (state.url) { $('urlText').textContent = state.url.replace(/([?&]token=)[^&]+/g, '$1[隱藏]'); $('urlText').classList.remove('dim-v'); }
  else { $('urlText').textContent = '（尚未取得已認證 URL）'; $('urlText').classList.add('dim-v'); }
  $('btnCopy').disabled = !state.url;

  $('cNode').innerHTML = '<span class="ok-v">' + (state.nodeVersion || '—') + '</span>';
  $('cCli').innerHTML = state.cliExists ? '<span class="ok-v">已安裝</span>' : '<span class="err-v">找不到</span>';
  $('cProfiles').textContent = (state.profiles && state.profiles.length) ? state.profiles.join('、') : '—';

  const chips = $('cPlugins');
  chips.innerHTML = '';
  for (const p of (state.plugins || [])) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = p;
    chips.appendChild(c);
  }
  if (!chips.childElementCount) chips.innerHTML = '<span class="chip">（無）</span>';

  if(document.activeElement!==$('portInput')) $('portInput').value = state.port;
  $('btnInstall').disabled=Boolean(state.busy);
  for(const id of ['btnStart','btnStop','btnRestart','btnOfmUpgrade','btnPatches','btnGuardInstall','btnGuardStatus','btnReloadPlugin']) $(id).disabled=busy||Boolean(state.busy);
  if(state.setup?.error) setNotes(state.setup.error);
  for (const d of $('modeSeg').children) d.classList.toggle('active', d.dataset.mode === state.mode);
  document.documentElement.dataset.theme = state.theme || 'light';
}

async function refresh() {
  try {
    const r = await api('/api/state');
    if (r.ok) render(r.state);
  } catch (e) {
    $('led').className = 'led off';
    $('statusText').textContent = '後端連線中斷';
  }
}

function connectEvents() {
  const es = new EventSource('/api/events?t=' + encodeURIComponent(TOKEN));
  es.addEventListener('log', (e) => { try { appendLog(JSON.parse(e.data)) } catch {} });
  es.addEventListener('state', (e) => { try { const s = JSON.parse(e.data); if (!busy) render(s); else render(Object.assign({}, s, {})); } catch {} });
  es.onerror = () => { /* 讓瀏覽器自動重連 */ };
}

function setNotes(txt) { $('notes').textContent = txt || ''; }

async function act(btn, label, fn) {
  setBusy(true, label);
  setNotes('');
  try {
    const r = await fn();
    if (r && r.ok === false) setNotes(r.error || (r.result && r.result.error) || '操作失敗');
    else if (r && r.result && r.result.notes) setNotes('· ' + r.result.notes.join('\n· '));
    if (r && r.state) render(r.state);
  } catch (e) {
    setNotes('發生錯誤：' + e.message);
  } finally {
    setBusy(false);
    refresh();
  }
}

$('btnStart').onclick = () => act('start', '啟動中…', () => api('/api/start', {
  method: 'POST', headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ port: Number($('portInput').value) || 3080 })
}));

$('btnStop').onclick = () => act('stop', '停止中…', () => api('/api/stop', { method: 'POST' }));

$('btnRestart').onclick = () => act('restart', '重新啟動中…', () => api('/api/restart', {
  method: 'POST', headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ port: Number($('portInput').value) || 3080 })
}));

$('btnCopy').onclick = async () => {
  const txt = authenticatedUrl;
  if (!txt || txt.startsWith('（')) return;
  const r = await api('/api/copy', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: txt }) });
  toast(r.ok ? '已複製 URL' : '複製失敗');
};

$('btnClear').onclick = () => { logBody.innerHTML = ''; logLines = []; };
$('btnReloadPage').onclick = () => location.reload();
$('btnReloadPlugin').onclick = () => patchAct('重載外掛', () =>
  api('/api/patch/reload', {method:'POST',headers:{'content-type':'application/json'},body:'{}'}));
$('btnInstall').onclick = () => act('install','正在檢查…',()=>api('/api/install',{method:'POST'}));

for (const b of document.querySelectorAll('[data-open]')) {
  b.onclick = async () => {
    const r = await api('/api/open', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ what: b.dataset.open }) });
    if (!r.ok) setNotes(r.error || '開啟失敗');
  };
}

$('modeSeg').onclick = async (e) => {
  const mode = e.target.dataset && e.target.dataset.mode;
  if (!mode) return;
  for (const d of $('modeSeg').children) d.classList.toggle('active', d === e.target);
  await api('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mode }) });
  toast(mode === 'app' ? '已切換為應用程式模式' : '已切換為瀏覽器模式');
};

$('portInput').onchange = async () => {
  const port = Number($('portInput').value) || 3080;
  const r=await api('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ port }) });
  if(!r.ok){setNotes(r.error||'無法更換連接埠');await refresh();}
};

$('themeBtn').onclick = async () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  await api('/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ theme: next }) });
};

// ─── 外掛與補丁管理 ─────────────────────────────────────────────
async function refreshPatches() {
  try {
    const r = await api('/api/patch/status');
    if (!r.ok) return;
    const s = r.patch;
    $('pOfm').textContent = s.version || '未安裝';
    const flags = [['syntax', '前端語法'], ['verify', '驗證鈕'], ['isolated', '獨立登入'], ['route','登入路由'], ['parse','驗證資訊'], ['autoexpand', '自動展開'], ['banner', '橫幅開關'], ['page', '補丁頁'], ['updateGate','更新保護'], ['reloadGate','重載保護']];
    const missing = flags.filter(([k]) => !s[k]);
    $('pPatch').innerHTML = missing.length === 0
      ? '<span class="ok-v">全部已套用</span>'
      : '<span class="err-v">缺 ' + missing.map(([,n]) => n).join('、') + '</span>';
    $('pAds').textContent = s.banner ? '可在插件「本地補丁」頁切換' : '補丁未套用';
    if(s.syntaxError)setPatchNotes('前端無法載入：'+s.syntaxError);
  } catch(e) { $('pPatch').textContent='狀態讀取失敗';setPatchNotes(e.message); }
}

function setPatchNotes(t) { $('patchNotes').textContent = t || ''; }
async function showUpdates(refresh=false){
  try{
    const r=await api('/api/updates'+(refresh?'?refresh=1':''));
    const names={available:'有新版（尚未安裝）',current:'與上游原始碼同版',ahead:'本機版本較新，保留本機版本',observed:'已查到上游版本',moved:'專案已搬移，需確認來源',archived:'專案已封存',unavailable:'暫時無法查詢，保留目前版本'};
    $('updateNotes').textContent=r.updates.projects.map(p=>p.name+'：'+(names[p.status]||p.status)+(p.version?' '+p.version:'')+(p.moved?' → '+p.repo:'')).join('\n')+'\n只偵測，不會在聊天時自動更新。';
  }catch(e){$('updateNotes').textContent='更新查詢失敗；目前版本不受影響。';}
}
$('btnUpdateCheck').onclick=()=>showUpdates(true);
showUpdates();

async function patchAct(label, fn) {
  setBusy(true, label);
  setPatchNotes('');
  try {
    const r = await fn();
    const note=r.started?'背景處理中，完成結果會顯示於即時日誌。':(r.note||r.result?.notes?.join('\n')||'完成');
    setPatchNotes(r.ok === false ? (r.error || '操作失敗') : note);
    appendLog({ t: Date.now(), line: '[補丁] ' + label + '：' + (r.ok === false ? (r.error || '失敗') : note) });
  } catch (e) { setPatchNotes('發生錯誤：' + e.message); }
  finally { setBusy(false); await refresh(); await refreshPatches(); }
}

$('btnOfmUpgrade').onclick = () => patchAct('升級 Our Free Model', () =>
  api('/api/patch/upgrade', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }));

$('btnPatches').onclick = () => patchAct('重新套用補丁', () =>
  api('/api/patch/reapply', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }));

$('btnGuardInstall').onclick = () => patchAct('移除舊版排程', () =>
  api('/api/patch/guard', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'remove' }) }));

$('btnGuardStatus').onclick = () => patchAct('補丁自檢', () =>
  api('/api/patch/guard', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'status' }) }));

(async () => {
  await refresh();
  const r = await api('/api/log');
  if (r.ok) { logBody.innerHTML = ''; for (const l of r.lines) appendLog(l); }
  connectEvents();
  setInterval(() => { if (!busy) refresh(); }, 3000);
  await refreshPatches();
  setInterval(() => { if (!busy) refreshPatches(); }, 10000);
})();
</script>
